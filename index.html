<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Nowa Gra</title>
<link rel="icon" href="data:,">
<link rel="apple-touch-icon" href="assets/icon.png">
<meta name="apple-mobile-web-app-title" content="Nowa Gra">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --sat: env(safe-area-inset-top, 0px);
    --sar: env(safe-area-inset-right, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
    --sal: env(safe-area-inset-left, 0px);
  }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
  body { position: fixed; inset: 0; }
  canvas {
    display: block; width: 100%; height: 100%;
    touch-action: none; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  #promo { position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; }
  #promo a {
    position: absolute; pointer-events: auto; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  #promo a:hover, #promo a:focus-visible { outline: 5px solid #f5f06e; outline-offset: 2px; }
</style>
</head>
<body>
<canvas id="game" aria-label="Nowa Gra"></canvas>

<div id="promo"></div>

<script src="js/physics.js"></script>
<script src="js/levels.js"></script>
<script src="js/font.js"></script>

<script src="js/audio.js"></script>
<script src="js/input.js"></script>
<script src="js/promo.js"></script>
<script src="js/game.js"></script>
</body>
</html>
